<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Big Shoulders"; src: url("/assets/fonts/big-shoulders-var.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "IBM Plex Mono"; src: url("/assets/fonts/plex-mono-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Public Sans"; src: url("/assets/fonts/public-sans-var.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #e2e9e7; color: #10262c; font-family: "Public Sans", sans-serif; position: relative; overflow: hidden; }
  .frame { position: absolute; inset: 28px; border: 1px solid #94aaa5; border-radius: 24px; background: #f2f5f4; }
  .tick { position: absolute; top: 27px; left: 76px; width: 72px; height: 5px; background: #0f6268; border-radius: 3px; }
  .inner { position: absolute; inset: 28px; padding: 44px 60px; display: flex; flex-direction: column; justify-content: space-between; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 19px; font-weight: 600; letter-spacing: 0.18em; color: #0f6268; text-transform: uppercase; }
  .name { font-family: "Big Shoulders", sans-serif; font-weight: 750; font-size: 138px; line-height: 0.92; text-transform: uppercase; letter-spacing: 0.006em; }
  .role { font-size: 29px; line-height: 1.4; color: #2d454b; max-width: 34ch; margin-top: 22px; }
  .role strong { color: #10262c; font-weight: 600; }
  .strip { display: flex; gap: 36px; font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #0f6268; }
  .strip span { display: flex; align-items: center; gap: 14px; }
  .strip span::before { content: ""; width: 10px; height: 10px; border: 2px solid #0f6268; border-radius: 50%; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="tick"></div>
  <div class="inner">
    <div>
      <p class="kicker">Security Engineer / Chico, California</p>
      <h1 class="name">Rasheed<br>Farhat</h1>
      <p class="role">Detection pipelines, security automation, and review tooling for emerging attack surfaces.</p>
    </div>
    <div class="strip">
      <span>Security+</span><span>CySA+</span><span>Detection-as-Code</span><span>MCP Security</span>
    </div>
  </div>
</body>
</html>
