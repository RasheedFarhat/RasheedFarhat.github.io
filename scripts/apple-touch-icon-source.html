<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; }
  body { width: 180px; height: 180px; background: #0f1211; color: #e8edea; position: relative; display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; }
  .frame { position: absolute; inset: 8px; background: #171b1a; border-radius: 6px; }
  .frame::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: rgba(255,255,255,0.06); }
  .edge { position: absolute; inset: 8px; border: 2px solid #38423f; border-radius: 6px; }
  .mark { position: relative; font-size: 76px; font-weight: 700; letter-spacing: -4px; line-height: 1; color: #6fbfb4; }
</style></head>
<body>
  <div class="frame"></div>
  <div class="edge"></div>
  <span class="mark">RF</span>
</body></html>
