<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; }

  .frame { position: absolute; inset: 10px; border: 4px solid #084c51; border-radius: 30px; }

</style></head>
<body>
  <div class="frame"></div>
  <span class="mark">RF</span>
</body></html>
